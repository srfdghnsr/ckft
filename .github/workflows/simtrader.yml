name: simtrader-tick

# 24 小时自动运行：交易时段每 10 分钟跑一轮，非交易时段每小时心跳一次。
# 所有 cron 均为 UTC；北京时间 = UTC+8。
on:
  schedule:
    # A股/期货 日盘：北京 09:00-15:59（UTC 01-07），工作日每 10 分钟
    - cron: "*/10 1-7 * * 1-5"
    # 商品期货 夜盘：北京 21:00-23:59（UTC 13-15），工作日每 10 分钟
    - cron: "*/10 13-15 * * 1-5"
    # 非交易时段心跳：每小时第 5 分钟（保持页面时间戳与状态新鲜）
    - cron: "5 0,8,9,10,11,12,16,17,18,19,20,21,22,23 * * *"
    # 周末：每 6 小时一次，确认系统仍健康
    - cron: "5 */6 * * 0,6"
  workflow_dispatch: {}      # 支持手动触发

# 串行执行，避免两轮同时改 state
concurrency:
  group: simtrader-tick
  cancel-in-progress: false

permissions:
  contents: write            # 写 state 分支
  pages: write               # 发布 Pages
  id-token: write            # deploy-pages 需要 OIDC

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt

      - name: 恢复历史状态（state 分支）
        run: |
          git fetch origin state --depth=1 2>/dev/null || true
          if git show FETCH_HEAD:data/state.json > /tmp/state.json 2>/dev/null; then
            mkdir -p data
            cp /tmp/state.json data/state.json
            echo "已恢复状态：$(wc -c < data/state.json) bytes"
          else
            echo "无历史状态，从初始资金 10000 开始"
          fi

      - name: 跑一轮（行情 → 信号 → 撮合 → 导出看板）
        env:
          TZ: Asia/Shanghai
          SIMTRADER_REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: python -m cloud.run_once

      - name: 持久化状态到 state 分支
        # 独立「单提交」分支：每次覆盖，不留历史，避免仓库体积随运行次数膨胀
        if: always()
        run: |
          set -e
          if [ ! -f data/state.json ]; then
            echo "无 state.json 可持久化，跳过"
            exit 0
          fi
          git config user.name  "simtrader-bot"
          git config user.email "simtrader-bot@users.noreply.github.com"

          export GIT_INDEX_FILE="$PWD/.git/state-index"
          git read-tree --empty
          git add -f data/state.json
          TREE=$(git write-tree)
          COMMIT=$(git commit-tree "$TREE" -m "state: $(date -u +%Y-%m-%dT%H:%M:%SZ)")
          unset GIT_INDEX_FILE

          git push -f origin "$COMMIT:refs/heads/state"
          echo "state 已更新：$COMMIT"

      - name: 配置 Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true       # 仓库未开启 Pages 时自动开启（源=GitHub Actions）

      - name: 上传站点产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: tick
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 发布到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
